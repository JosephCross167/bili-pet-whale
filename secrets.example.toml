# 复制成 secrets.toml 再填真实值。这个模板本身可以进 git。
#
#   copy secrets.example.toml secrets.toml
#
# secrets.toml 已被 .gitignore 忽略，永远不会入库。

[account]
# 宠物号（B 站账号）
uid = 0
name = ""

[targets]
# 白名单：只有这两个 UID 能收到私信、被 @、执行指令
admin_uid = 0
# 日报收件邮箱
report_mail = ""

[llm]
# DeepSeek API key（也可以改用环境变量 BILI_PET_LLM_KEY）
api_key = ""

[mail]
# SMTP 账号与授权码（163 邮箱的「授权码」，不是登录密码）
username = ""
password = ""
